services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hackathon-tmt-db
    environment:
      POSTGRES_USER: tmt
      POSTGRES_PASSWORD: tmt_dev_password
      POSTGRES_DB: hackathon_tmt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmt -d hackathon_tmt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
